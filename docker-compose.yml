version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dentist
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/dentist
      AI_SERVICE_URL: http://ai_service:8001
      SECRET_KEY: change-me-in-production
    depends_on:
      postgres:
        condition: service_healthy
      ai_service:
        condition: service_started
    volumes:
      - backend_uploads:/app/uploads

  ai_service:
    build: ./ai_service
    ports:
      - "8001:8001"
    environment:
      MODEL_PATH: /app/model.pt

volumes:
  pgdata:
  backend_uploads:
